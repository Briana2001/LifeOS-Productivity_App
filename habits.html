<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeOS - Habits</title>
    <script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          accent: "#0BBFD6",
          surface: "#050508",
          "surface-2": "#08080c",
        },
      },
    },
    plugins: [
      function ({ addComponents }) {
        addComponents({
          // ---------- NAV ITEM ----------
          ".nav-item": {
            position: "relative",
            display: "flex",
            alignItems: "center",
            gap: "0.75rem",
            height: "2.375rem",          /* 38px */
            padding: "0 0.75rem",
            borderRadius: "0.5rem",
            fontSize: "13.5px",
            color: "#a1a1aa",             /* zinc-400 */
            transition: "background-color 150ms ease, color 150ms ease",
            "&:hover": {
              backgroundColor: "rgba(255,255,255,0.04)",
              color: "#e4e4e7",
            },
          },

          // ---------- ICON ----------
          ".nav-svg": {
            width: "18px",
            height: "18px",
            flexShrink: "0",
            fill: "currentColor",
            opacity: "0.65",
            transition: "opacity 150ms ease",
          },
          ".nav-item:hover .nav-svg": {
            opacity: "1",
          },

          // ---------- ACTIVE ----------
          ".nav-active": {
            backgroundColor: "rgba(11,191,214,0.10)",
            color: "#22D3EE",
            fontWeight: "500",
          },
          ".nav-active .nav-svg": {
            opacity: "1",
          },
          ".nav-active::before": {
            content: '""',
            position: "absolute",
            left: "-0.75rem",
            top: "0.5rem",
            bottom: "0.5rem",
            width: "2px",
            borderTopRightRadius: "2px",
            borderBottomRightRadius: "2px",
            backgroundColor: "#0BBFD6",
          },
        });
      },
    ],
  };
</script>
</head>
<body>
    <div class="min-h-screen bg-[#050508] text-white flex items-center justify-center px-6">

  <div class="text-center max-w-md">

    <!-- Icon -->
    <div class="mx-auto mb-6 flex items-center justify-center w-16 h-16 
                rounded-2xl border border-cyan-400/30 
                bg-cyan-400/10 text-cyan-400">
      <svg xmlns="http://www.w3.org/2000/svg"
           fill="none"
           viewBox="0 0 24 24"
           stroke-width="1.5"
           stroke="currentColor"
           class="w-8 h-8">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 6v6l4 2m6-2a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z" />
      </svg>
    </div>

    <!-- Heading -->
    <h1 class="text-3xl font-bold tracking-tight mb-3">
      Coming Soon
    </h1>

    <!-- Description -->
    <p class="text-gray-400 text-sm leading-6 mb-7">
      This part of LifeOS is still being built.
      Great things take time — we're working on it.
    </p>

    <!-- Status -->
    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full
                border border-cyan-400/20 bg-cyan-400/5
                text-cyan-400 text-xs font-medium">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
      Under Development
    </div>

    <!-- Footer -->
    <p class="mt-8 text-xs text-gray-600">
      LIFEOS · Your Life. Optimized.
    </p>

  </div>

</div>
</body>
</html>
